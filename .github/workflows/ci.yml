name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Install Chromium for the web page tests
        run: npx playwright-core install --with-deps chromium
      - name: Tests (transcripts, walkthroughs, validator, leaks, external packs, CLI, browser)
        run: npm test
        env:
          REQUIRE_BROWSER: '1'
      - name: Validate the demo packs with the command line
        run: |
          node src/cli/main.ts validate packs/halcyon-relay
          node src/cli/main.ts validate packs/sorrow-creek
      - name: Build site and CLI
        run: npm run build

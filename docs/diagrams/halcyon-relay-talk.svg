<svg xmlns="http://www.w3.org/2000/svg" width="720" height="608" viewBox="0 0 720 608" role="img" aria-label="The Halcyon Relay: conversations">
<title>The Halcyon Relay: conversations</title>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 11px; fill: #1f1d1a; }
.title { font-size: 16px; font-weight: 700; }
.sub, .muted { fill: #77706a; }
.head { font-size: 12px; font-weight: 700; }
.small { font-size: 10px; }
.em { font-style: italic; }
.b { font-weight: 700; }
.item { fill: #0d7a4f; font-weight: 700; }
.scenery { fill: #1c6a8c; font-weight: 700; }
.person { fill: #7a3fb0; font-weight: 700; }
.exit { fill: #b0590e; font-weight: 700; }
.missing { fill: #c0262d; text-decoration: underline; }
.gate { fill: #c0262d; }
.goal { fill: #2f5e1e; font-weight: 700; }
.end { fill: #8a1c1c; font-weight: 700; }
.card { fill: #ffffff; stroke: #1f1d1a; stroke-width: 1.2; }
.card-muted { fill: #ffffff; stroke: #77706a; stroke-width: 1; stroke-dasharray: 4 3; }
.band { stroke: none; }
.edge { fill: none; stroke: #1f1d1a; stroke-width: 1.4; }
.edge-gate { fill: none; stroke: #c0262d; stroke-width: 1.6; stroke-dasharray: 6 4; }
.edge-soft { fill: none; stroke: #77706a; stroke-width: 1.2; }
.label-bg { fill: #faf8f3; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1d1a"/></marker>
<marker id="arrow-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0262d"/></marker>
<marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#77706a"/></marker>
</defs>
<rect width="100%" height="100%" fill="#faf8f3"/>
<text x="24" y="38" class="title" xml:space="preserve">The Halcyon Relay: conversations</text>
<text x="24" y="56" class="sub" xml:space="preserve">Each line the player can choose, the reply, and where it leads. Numbers on lines are menu choices.</text>
<text x="24" y="96" class="head" xml:space="preserve"><tspan class="person">maintenance drone</tspan></text>
<rect class="card" x="24" y="110" width="310.4" height="454" rx="4"/>
<rect class="band" x="24.6" y="110.6" width="309.2" height="24" rx="3.5" fill="#f3e7f1"/>
<text x="34" y="126" class="head" xml:space="preserve">ASK / TELL ABOUT</text>
<text x="324.4" y="126" class="small muted" text-anchor="end">8 topics</text>
<text x="34" y="152" class="small muted" xml:space="preserve">talk to: “The drone turns its eye towards</text>
<text x="34" y="166" class="small muted" xml:space="preserve">you.”</text>
<line x1="34" y1="172" x2="324.4" y2="172" stroke="#d9d3c7"/>
<text x="34" y="184" class="b" xml:space="preserve">power / blackout / reactor / coupling</text>
<text x="34" y="198" class="small em" xml:space="preserve">   &quot;Main power coupling failed during the</text>
<text x="34" y="212" class="small em" xml:space="preserve">   debris strike,&quot; the drone says.</text>
<text x="34" y="226" class="small muted" xml:space="preserve">   only if act Blackout</text>
<text x="34" y="246" class="b" xml:space="preserve">power / blackout / reactor / coupling</text>
<text x="34" y="260" class="small em" xml:space="preserve">   &quot;Main power nominal,&quot; the drone says.</text>
<text x="34" y="280" class="b" xml:space="preserve">stores / code / keypad / door</text>
<text x="34" y="294" class="small em" xml:space="preserve">   &quot;The stores code is recorded in the</text>
<text x="34" y="308" class="small em" xml:space="preserve">   maintenance log,&quot; the drone says.</text>
<text x="34" y="328" class="b" xml:space="preserve">dish / antenna / beacon / signal</text>
<text x="34" y="342" class="small em" xml:space="preserve">   &quot;Dish alignment nominal.</text>
<text x="34" y="356" class="small muted" xml:space="preserve">   only if relay dish aligned</text>
<text x="34" y="376" class="b" xml:space="preserve">dish / antenna / beacon / signal</text>
<text x="34" y="390" class="small em" xml:space="preserve">   &quot;Dish alignment fault,&quot; the drone says.</text>
<text x="34" y="410" class="b" xml:space="preserve">wren / ship / tender / supply</text>
<text x="34" y="424" class="small em" xml:space="preserve">   &quot;Supply tender Wren,&quot; the drone says.</text>
<text x="34" y="444" class="b" xml:space="preserve">suit / air</text>
<text x="34" y="458" class="small em" xml:space="preserve">   &quot;Your suit holds air for a short job</text>
<text x="34" y="472" class="small em" xml:space="preserve">   only,&quot; the drone says.</text>
<text x="34" y="492" class="b" xml:space="preserve">dark / torch / light / shaft</text>
<text x="34" y="506" class="small em" xml:space="preserve">   &quot;The shaft and reactor bay are unlit</text>
<text x="34" y="520" class="small em" xml:space="preserve">   without main power,&quot; the drone says.</text>
<text x="34" y="540" class="small muted" xml:space="preserve">anything else: “The drone's eye light</text>
<text x="34" y="554" class="small muted" xml:space="preserve">flickers.”</text>
</svg>
